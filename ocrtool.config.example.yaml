inboxPath: ./inbox
jobStorePath: ./.ocrtool/jobs
host: 127.0.0.1
port: 4312
defaultEngine: tesseract
nativeTextMinChars: 24
textExtractionMode: auto # auto skips OCR when native text is good; ocr forces rendered-image OCR for every page
engines:
  tesseract:
    kind: tesseract
    lang: eng
    trainedDataPath: ./tessdata
  deepseek-ocr:
    kind: deepseek-ocr
    ollamaHost: http://127.0.0.1:11434
    model: deepseek-ocr
    chatTimeoutMs: 180000
    maxOutputTokens: 4096
  # NuExtract3 document-to-Markdown via a local mlx-vlm OpenAI-compatible server.
  # Prerequisite: pip install mlx-vlm && python -m mlx_vlm.server --model numind/NuExtract3-mlx-nvfp4
  # serverHost must stay local (localhost, 127.0.0.1, or ::1). mlx-vlm defaults to port 8080.
  # nuextract3-ocr:
  #   kind: nuextract3-ocr
  #   serverHost: http://127.0.0.1:8080
  #   model: numind/NuExtract3-mlx-nvfp4
  #   chatTimeoutMs: 180000
  #   maxOutputTokens: 4096
